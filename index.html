<p style="margin:0;font-size:14px;font-weight:500">Tap any button below. No questions to answer first. Your location can be shared.</p>
</div>
<div class="pad" style="padding-top:18px">
<button class="sosb" style="background:#2F7A55" onClick="{{ callAnmGo }}"><span class="si"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.phone }}"></path></svg></span><span class="col"><span style="font-size:18px;font-weight:800">Call ANM</span><span style="font-size:13.5px;font-weight:500">{{ anmLine }}</span></span></button>
<button class="sosb" style="background:#C9483C" onClick="{{ callAmb }}"><span class="si"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.amb }}"></path></svg></span><span class="col"><span style="font-size:18px;font-weight:800">Call ambulance</span><span style="font-size:13.5px;font-weight:500">108 or 112</span></span></button>
<button class="sosb" style="background:#2F72AA" onClick="{{ callAsha }}"><span class="si"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.phone }}"></path></svg></span><span class="col"><span style="font-size:18px;font-weight:800">Call ASHA</span><span style="font-size:13.5px;font-weight:500">{{ ashaLine }}</span></span></button>
<a class="sosb" style="background:#4C6FA8" href="https://www.google.com/maps/search/nearest+hospital" target="_blank"><span class="si"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.hosp }}"></path></svg></span><span class="col"><span style="font-size:18px;font-weight:800">Nearest health centre</span><span style="font-size:13.5px;font-weight:500">{{ hospLine }}</span></span></a>
<button class="sosb" style="background:#7A3A8C" onClick="{{ shareLoc }}"><span class="si"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.pin }}"></path></svg></span><span class="col"><span style="font-size:18px;font-weight:800">Share my location</span><span style="font-size:13.5px;font-weight:500">With family or midwife, only when you allow</span></span></button>

<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn2" style="flex:1" onClick="{{ openContacts }}">Saved contacts</button></div>

</div>
</div>
</sc-if>

<sc-if value="{{ sc.call }}" hint-placeholder-val="{{ false }}">

add('pre1', 'pre', 'Planning for pregnancy', 'Thinking ahead gives you time to get healthy and informed before you conceive.', ['Talk with a doctor or ANM about your health history, ideally a few months before trying.', 'Think about work, money and who will support you at home.', 'Ask which checks and supplements are right for you.']);
add('pre2', 'pre', 'Preconception health check', 'A preconception visit looks at your overall health.', ['Your clinician may ask about past pregnancies, periods and family history.', 'Blood pressure, weight and vaccination status are often reviewed.', 'Bring a list of questions and any earlier reports.']);
add('pre4', 'pre', 'Nutrition and lifestyle', 'Everyday habits shape your health before and during pregnancy.', ['Balanced meals with grains, pulses, vegetables, fruit and dairy or alternatives are commonly encouraged.', 'Folic acid is often discussed before pregnancy. Ask your clinician whether and how much to take.', 'Ask for support if you smoke, chew tobacco or drink alcohol.']);
add('pre6', 'pre', 'Consultations and tests', 'Your clinician decides which tests suit you.', ['Not every test is needed for every woman.', 'Tests may include blood tests and checks for infections or anaemia.', 'Keep your results in the Health section.']);
add('pre7', 'pre', 'Vaccination discussions', 'Vaccines can protect you and your baby.', ['Ask which vaccines you may need before pregnancy and whether any should be completed first.', 'Some vaccines are not advised during pregnancy, so timing matters.', 'Follow the local immunisation schedule and your clinician\'s advice.']);
add('pre8', 'pre', 'Warning signs: when to seek care', 'Some symptoms need prompt care at any time.', ['Heavy bleeding, severe pain, high fever or fainting need urgent medical attention.', 'If you may be pregnant and have bleeding or one-sided pain, seek care promptly.', 'If you feel something is wrong, get help. Do not wait.'], true);
add('t1a', 't1', 'Your baby\'s early development', 'The first weeks are when your baby\'s organs begin to form.', ['Development is rapid. A qualified clinician may check the early heartbeat on an ultrasound.', 'Week-by-week information is general. Your care team checks how your own baby is growing.', 'Try not to compare yourself with others. Every pregnancy is different.']);
add('t1b', 't1', 'Changes in your body', 'Many changes in early pregnancy are common.', ['Tender breasts, tiredness, nausea or vomiting and changes in appetite are common.', 'Emotions can shift quickly. Talk to someone you trust.', 'Contact your clinician if vomiting is severe or you cannot keep fluids down.']);
add('t1c', 't1', 'Eating well in early pregnancy', 'Small habits can ease nausea and support your health.', ['Choose balanced meals. Small, frequent meals can help with nausea.', 'Sip fluids through the day.', 'Practise food safety: wash produce, cook food well, and ask which foods to avoid.']);
add('t1d', 't1', 'Antenatal tests and scans', 'Your clinician will suggest tests at certain times.', ['Blood tests, urine tests and an ultrasound may be advised, following your clinician\'s schedule.', 'Screening for chromosomal conditions (such as NIPT/NIPS) is optional and may not be available everywhere. Discuss benefits and limits.', 'A screening test gives a chance, not a diagnosis.']);
add('t1e', 't1', 'Vaccination in pregnancy', 'Some vaccines are given during pregnancy.', ['Vaccines follow the current local antenatal schedule and your clinician\'s advice.', 'Ask your ANM or doctor which ones are advised for you and when.', 'Keep your vaccination records in your history.']);
add('t1f', 't1', 'Warning signs in early pregnancy', 'Know when to call for help.', ['Heavy vaginal bleeding, or severe abdominal pain or cramping.', 'High fever, fainting, or vomiting so severe you cannot keep fluids down.', 'Contact your care team or emergency services. The app cannot tell you the cause.'], true);
add('t2a', 't2', 'Your baby\'s growth', 'Your baby grows and develops quickly in these months.', ['Your clinician checks growth at antenatal visits.', 'You may start to feel movements. Timing varies from woman to woman.', 'Week-specific details are awaiting medical review.']);
add('t2b', 't2', 'Changes in your body', 'Your body keeps adapting as your baby grows.', ['Backache, heartburn, leg cramps and swelling can happen.', 'Rest with your feet up and wear comfortable shoes.', 'Sudden or severe swelling of the face or hands needs prompt medical advice.']);
add('t2c', 't2', 'Nutrition and hydration', 'Good food and fluids support you and your baby.', ['Include iron-rich and calcium-rich foods as your clinician advises.', 'Drink water regularly through the day.', 'Ask for advice if you are vegetarian or have cravings that worry you.']);
add('t2d', 't2', 'Antenatal visits and investigations', 'Follow the schedule your care team gives you.', ['Keep every visit your care team recommends.', 'Tests such as an anomaly scan or glucose testing are scheduled by your clinician.', 'Keep your reports in the Health section.']);
add('t2e', 't2', 'Learning about baby movements', 'Getting to know your baby\'s usual pattern helps.', ['Many women notice movements in the second trimester. Timing varies.', 'Notice what is usual for your baby.', 'Follow your clinician\'s guidance. No single number applies to everyone.']);
add('t2f', 't2', 'Mental and emotional well-being', 'Mood swings and worry are common.', ['Sleep, support from family and gentle activity can help.', 'Share how you feel with your ANM, ASHA, doctor or someone you trust.', 'Tell your care team if you feel low or anxious most days.']);
add('t2g', 't2', 'Warning signs', 'Know when to call for help.', ['Heavy bleeding, leaking fluid, or severe abdominal pain.', 'Severe headache with vision changes, or sudden swelling.', 'Baby moving less than usual for them. Call promptly.'], true);
add('iron1', 't2', 'Iron-rich foods in the second trimester', 'Iron helps your body make blood for you and your baby.', ['Pulses, green leafy vegetables, eggs, meat or fish, and fortified foods are common sources.', 'Foods with vitamin C, such as citrus or tomato, can help your body absorb iron from plant foods.', 'Take iron tablets only as prescribed. Ask your clinician before starting or stopping any supplement.']);
add('t3a', 't3', 'Your baby\'s development', 'Your baby gains weight and gets ready for birth.', ['Growth and position are checked by your care team.', 'You may feel more pressure low in your belly.', 'Week-specific details are awaiting medical review.']);
add('t3b', 't3', 'Changes in your body', 'Late pregnancy can feel heavy and tiring.', ['Breathlessness, back pain, swelling, trouble sleeping and practice contractions can happen.', 'Rest on your side and take short walks if your clinician says it is fine.', 'Report regular painful contractions or leaking fluid.']);
add('t3c', 't3', 'Clinician-guided monitoring', 'Visits are usually more frequent now.', ['Blood pressure and baby\'s growth are checked at visits.', 'Extra scans or tests may be advised depending on your situation.', 'Keep appointments and bring your records.']);
add('t3d', 't3', 'Baby movement awareness', 'Knowing your baby\'s usual pattern is important.', ['Notice your baby\'s usual pattern each day.', 'If movements are reduced or absent compared with usual, contact your maternity team promptly. Do not wait.', 'A count alone cannot tell you that all is well.']);
add('t3e', 't3', 'Nutrition and rest', 'Small steps help you feel more comfortable.', ['Small balanced meals and regular fluids can ease heartburn and tiredness.', 'Support pillows can help sleep.', 'Ask your clinician about iron and calcium.']);
add('t3f', 't3', 'Birth planning', 'A simple plan helps you feel prepared.', ['Think about who you want with you, positions and pain relief options.', 'Plans can change for safety. Flexibility is normal.', 'Discuss your plan with your doctor or midwife.']);
add('t3g', 't3', 'Warning signs and emergency contacts', 'Be ready to act quickly.', ['Heavy bleeding, regular strong contractions before 37 weeks, or fluid leaking.', 'Severe headache, vision changes or a seizure.', 'Reduced or absent baby movements. Save emergency numbers in SOS.'], true);
add('d1', 'del', 'Birth preferences and plan', 'Write what matters to you.', ['Think about who you want with you, positions and pain relief options.', 'Write a simple plan to share with your team.', 'Your team may change plans for safety and will explain why.']);
add('d2', 'del', 'Maternity facility details', 'Know where you are going.', ['Know the facility name, address and how to reach the labour ward.', 'Ask whether it can manage emergencies or would refer you.', 'Save the details in your emergency contacts.']);
add('d3', 'del', 'Transport planning', 'Plan how you will get there.', ['Decide how you will travel by day or night.', 'Keep ambulance numbers handy: 112, and 108 where available.', 'Have a back-up plan.']);
add('d4', 'del', 'Support person and contacts', 'Choose who will be with you.', ['Pick someone who can stay with you and make calls.', 'Save their number in the app.', 'Share your plan with them.']);
add('d5', 'del', 'Hospital bag checklist', 'Pack a few weeks early.', ['For you: ID, health papers, comfortable clothes, sanitary pads, toiletries, phone and charger.', 'For baby: soft clothes, a blanket, a cap and nappies.', 'Ask your facility if there is anything specific to bring.']);
add('d6', 'del', 'Important documents', 'Keep papers together.', ['Antenatal card, scan and test reports, vaccination record.', 'ID, and insurance or scheme papers if you have them.', 'Copies are in the Health section of this app.']);
add('d7', 'del', 'Questions for your doctor or midwife', 'Ask before the day arrives.', ['When should I come to the facility?', 'Who do I call if labour starts?', 'What help is there for feeding my baby?']);
add('p1', 'post', 'Maternal recovery', 'Your body needs time to heal after birth.', ['Rest when you can and accept help with chores.', 'Eat regular meals and drink fluids, especially if breastfeeding.', 'Go to follow-up visits and ask about stitches, pain and activity.']);
add('p2', 'post', 'Bleeding and physical changes', 'Some changes after birth are expected.', ['Some bleeding is expected and changes over weeks.', 'Cramps, tender breasts and tiredness are common early on.', 'Soaking pads quickly, large clots or smelly discharge need prompt medical advice.']);
add('p3', 'post', 'Emotional well-being', 'Many mothers feel tearful or overwhelmed at first.', ['Sleep, support and talking can help.', 'Tell someone how you are feeling.', 'If low mood or anxiety lasts or gets worse, tell your care team.']);
add('p4', 'post', 'Breastfeeding support', 'Feeding takes practice for you and your baby.', ['Early skin-to-skin contact and frequent feeding help many mothers get started.', 'Pain, a poor latch or worry about milk are common. Ask a midwife or lactation counsellor.', 'Ask your clinician before taking any medicine while breastfeeding.']);
add('p5', 'post', 'Newborn care basics', 'Simple routines keep your baby comfortable.', ['Keep the cord area clean and dry as advised.', 'Hold, feed and talk to your baby often. Newborns feed frequently.', 'Go to your baby\'s checks and immunisation visits.']);
add('p6', 'post', 'Follow-up appointments', 'Check-ups matter after birth too.', ['Ask when your postnatal check-up and your baby\'s checks are due.', 'Bring questions about recovery, feeding and family planning.', 'Add the appointments in this app.']);
add('p7', 'post', 'Medicines after birth', 'Take medicines exactly as prescribed.', ['Take only what your clinician prescribed.', 'Record taken, missed or skipped doses in the app.', 'If you miss a dose, ask your clinician what to do. Never double up.']);
add('p8', 'post', 'Postpartum warning signs', 'Know when to get help after birth.', ['Heavy bleeding, fever, severe headache or vision changes.', 'Chest pain, trouble breathing, or a swollen painful leg.', 'Thoughts of harming yourself or your baby: get help straight away.'], true);
add('p9', 'post', 'Mental health support', 'Postnatal depression and anxiety can be treated.', ['They can affect any mother and are not your fault.', 'Talk to your ANM, ASHA, doctor or a person you trust.', 'If you feel unsafe, call emergency services.']);
add('p10', 'post', 'Family and caregiver support', 'Recovery is easier with help.', ['Share night feeds and chores where possible.', 'Listen without judging and encourage rest.', 'Learn the warning signs so you can get help quickly.']);
add('act1', 'life', 'Safe physical activity', 'Gentle movement can help many women.', ['Walking is commonly encouraged unless your clinician advises otherwise.', 'Stop and seek advice if you feel dizzy, breathless, or have pain or bleeding.', 'Ask which activities are right for you.']);
add('act2', 'life', 'Rest, posture and sleep', 'Small changes ease aches.', ['Sleeping on your side with pillows can be comfortable.', 'Avoid heavy lifting and bend with your knees.', 'Take short rests during the day.']);
add('nut2', 'life', 'Food safety', 'Safer food helps protect you and your baby.', ['Wash hands, fruit and vegetables.', 'Cook meat, eggs and fish well and drink safe water.', 'Ask your clinician about foods or herbal products to avoid.']);
add('faq1', 'faq', 'How often should I visit my care team?', 'Your care team sets a schedule for you.', ['Visits are usually more frequent later in pregnancy.', 'Go sooner if you are worried.', 'Keep a list of questions for each visit.']);
add('faq2', 'faq', 'Is it safe to take medicines?', 'Check before you take anything.', ['Take only what a clinician prescribed.', 'Ask a doctor or pharmacist before any medicine or herbal product.', 'Never stop a prescribed medicine on your own.']);
add('faq3', 'faq', 'When should I go to the hospital?', 'Plan this with your care team in advance.', ['Go straight away for any warning sign.', 'Ask your team when to come if labour begins.', 'Keep transport and emergency numbers ready.']);
add('m1', 'myth', 'Myth: you are eating for two', 'You need a little extra energy later on, not double portions.', ['Quality matters more than quantity: balanced meals and fluids.', 'Ask your care team what weight gain suits you.', 'Small, regular meals can help with nausea and heartburn.']);
add('m2', 'myth', 'Myth: all exercise is unsafe', 'Gentle activity is encouraged for many women.', ['Many women can stay active unless told otherwise.', 'Stop and ask for advice if you have pain, bleeding, dizziness or breathlessness.', 'Your clinician can tell you what suits you.']);
add('m3', 'myth', 'Myth: herbal products are always safe', 'Natural does not always mean safe in pregnancy.', ['Check with your doctor or pharmacist before using any herbal product.', 'Never replace prescribed medicine with home remedies.', 'Tell your care team about everything you take.']);
