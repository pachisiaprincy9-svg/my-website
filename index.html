<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MateriCare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--page:#F9E6F0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--page);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
#root{height:100%;display:flex;align-items:center;justify-content:center}

body{margin:0}
.app{--f:'Poppins',system-ui,sans-serif;--fs:'Playfair Display',Georgia,serif;--ink:#3A2B3F;--mut:#7B6B80;--pri:#7A3A8C;--prid:#7A3A8C;--pink:#E58AB5;--sof:#F5E4F0;--line:#F3DFEA;--bg:#FDF3F7;--sos:#C9483C;--ok:#2F7A55;--blue:#2F72AA;--grad:linear-gradient(135deg,#7A3A8C 0%,#A5409B 55%,#C24A8F 100%);--shl:0 14px 30px rgba(160,70,120,.14);--shs:0 4px 14px rgba(160,70,120,.08);
width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(180deg,#FDF3F7 0%,#F9EEF8 100%);color:var(--ink);font-family:var(--f);display:flex;flex-direction:column;box-sizing:border-box}
.app *{box-sizing:border-box;font-family:var(--f)}
.app :focus-visible{outline:3px solid #1F5FE0;outline-offset:2px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;box-shadow:var(--shs);flex:none;position:relative;z-index:2;border-radius:0 0 26px 26px}
.tt,.hi,.big,.h2,.sh h2,.dlg h2{font-family:var(--fs)!important;font-variant-numeric:lining-nums;letter-spacing:.1px}
.tt{flex:1;margin:0;font-size:19px;font-weight:600;line-height:1.25}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sof);display:flex;align-items:center;justify-content:center;color:var(--pri);cursor:pointer;flex:none;padding:0;position:relative}
.ibtn.w{background:#fff;box-shadow:var(--shs)}
.ibtn.g{background:#FDE0EC;color:#A23671}
.ibtn.b{background:#EBE1F7;color:#5B3A9A}
.avt{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;font-family:var(--fs);font-weight:600;font-size:18px;cursor:pointer;flex:none}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;box-shadow:var(--shs);flex:none;position:relative;z-index:2;border-radius:0 0 26px 26px}
.pad{padding:16px 16px 22px}
.card{background:#fff;border:0;border-radius:28px;padding:16px;margin-bottom:14px;box-shadow:var(--shs)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.cap{font-size:11.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--mut)}
.muted{color:var(--mut);font-size:13px;font-weight:400;line-height:1.45}
.p{margin:0;font-size:14px;line-height:1.6;font-weight:400}
.b{font-weight:600;font-size:15px;line-height:1.35}
.h2{margin:0;font-size:19px;font-weight:600}
.sh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.sh h2{margin:0;font-size:19px;font-weight:600}
.lnk{background:none;border:0;color:var(--pri);font-weight:600;font-size:14px;min-height:44px;padding:0 4px;cursor:pointer}
.btn,.btn2,.dng,.btnw{min-height:50px;border-radius:99px;border:0;font-weight:600;font-size:15px;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(165,64,155,.28)}
.btn2{background:#fff;color:var(--pri);border:1.5px solid #D9A6CC}
.dng{background:var(--sos);color:#fff}
.btnw{background:#fff;color:var(--pri);box-shadow:var(--shs)}
.full{width:100%}
.chip{min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid #F0D3E3;background:#fff;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;flex:none}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.symc{min-height:44px;padding:0 16px;border-radius:99px;border:0;background:#F9E6F0;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer}
.symc.on{background:var(--grad);color:#fff}
.inp{width:100%;min-height:48px;border:1.5px solid #F0D8E5;border-radius:18px;padding:0 14px;font-weight:400;font-size:15px;background:#fff;color:var(--ink)}
textarea.inp{padding:12px 14px;min-height:92px;line-height:1.5}
.lbl{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
.err{background:#FDEBE7;color:#8E2A0A;border-radius:18px;padding:12px 14px;font-weight:500;font-size:13.5px;margin:10px 0}
.note{background:linear-gradient(120deg,#FBE7F1 0%,#F1E6FA 100%);color:#4A2B63;border-radius:22px;padding:12px 14px;font-weight:400;font-size:13px;line-height:1.5;margin:10px 0}
.urg{background:#FDEBE7;border:1.5px solid #F0B3A0;color:#6F2007;border-radius:22px;padding:14px;margin:12px 0;font-size:13.5px;line-height:1.5;font-weight:500}
.rowcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:0;box-shadow:var(--shs);border-radius:28px;padding:14px 16px;margin-bottom:12px;cursor:pointer;min-height:64px;color:var(--ink)}
.tic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ti-p{background:#EFE2F8;color:#6B3A9A}.ti-g{background:#FDE3EE;color:#A23671}.ti-b{background:#E7E4FA;color:#4A3FA0}.ti-r{background:#F9DAD6;color:#A33A2F}.ti-t{background:#FFEBDD;color:#A4502A}
.tg{display:inline-block;border-radius:99px;padding:7px 13px;font-weight:500;font-size:13px}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tile{background:#fff;border:0;box-shadow:var(--shs);border-radius:28px;padding:14px 8px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;cursor:pointer;min-height:112px;color:var(--ink);font-weight:500;font-size:13px}
.tile.l{align-items:flex-start;text-align:left;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.bar{height:8px;border-radius:99px;background:#F3DFEA;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#7A3A8C,#E58AB5);border-radius:99px}
.hhero{position:relative;overflow:hidden;background:linear-gradient(160deg,#FBDDEA 0%,#F6E4F4 55%,#EBE2F9 100%);padding:16px 16px 24px;border-radius:0 0 42px 42px}
.hhero::before{content:'';position:absolute;right:-44px;top:-56px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,255,255,0) 70%)}
.hhero::after{content:'';position:absolute;left:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(213,185,240,.6) 0%,rgba(213,185,240,0) 70%)}
.hhero>*{position:relative;z-index:1}
.gm{margin:0;font-size:13px;font-weight:400;color:var(--mut)}
.hi{margin:0;font-size:28px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.wkcard{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#fff;border:0;border-radius:30px;padding:18px;margin-top:16px;cursor:pointer;color:var(--ink);box-shadow:var(--shl)}
.big{font-size:34px;font-weight:700;color:var(--pri);line-height:1.1}
.ring{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.ringin{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.grad{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:30px;padding:18px;margin-bottom:14px;box-shadow:var(--shl)}
.grad::after{content:'';position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.grad::before{content:'';position:absolute;right:30px;bottom:-46px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.09)}
.grad>*{position:relative;z-index:1}
.grad *{color:#fff!important}
.grad .muted,.grad .cap{color:rgba(255,255,255,.92)!important}
.grad svg{stroke:#fff}
.moodcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:30px;padding:14px 16px;margin:12px 0 14px;cursor:pointer;background:linear-gradient(120deg,#FBE0EC 0%,#F0E2FA 100%);color:var(--ink);min-height:76px;box-shadow:var(--shs)}
.sosban{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:30px;padding:16px 18px;cursor:pointer;background:var(--sos);color:#fff;box-shadow:0 8px 20px rgba(201,72,60,.28);min-height:72px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;margin:0 12px 12px;border-radius:30px;box-shadow:var(--shl);padding:6px 4px;flex:none}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;color:var(--mut);font-weight:500;font-size:12px;cursor:pointer}
.nvi{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nv.on .nvi{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(165,64,155,.32)}
.nv.on{color:var(--pri);font-weight:600}
.nv.sos{color:var(--sos)}
.nv.sos.on .nvi{background:var(--sos);color:#fff;box-shadow:0 6px 14px rgba(201,72,60,.3)}
.ov{position:absolute;inset:0;background:rgba(58,43,63,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.dlg{background:#fff;border-radius:34px 34px 0 0;padding:22px 18px 26px;width:100%}
.dlg h2{margin:0 0 6px;font-size:20px;font-weight:600}
.toast{position:absolute;left:16px;right:16px;top:12px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 14px;font-weight:500;font-size:13.5px;z-index:40;line-height:1.4;box-shadow:var(--shl)}
.fbar{position:sticky;bottom:0;background:#FDF3F7;padding:10px 16px 14px;display:flex;gap:10px;align-items:center}
.callbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:28px;background:var(--sos);color:#fff;font-weight:700;font-size:21px;text-decoration:none;margin-bottom:10px}
.sosb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:28px;padding:16px;margin-bottom:12px;cursor:pointer;color:#fff;min-height:84px;box-shadow:var(--shl);text-decoration:none}
.sosb .si{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex:none}
.fileT{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:118px;border:2px dashed #E3B5D0;border-radius:30px;background:#FCEBF3;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;text-align:center}
.fileT input,.fileL input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fileL{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;border:1.5px dashed #E3B5D0;border-radius:20px;padding:10px 14px;background:#fff;font-weight:600;font-size:14px;color:var(--pri);cursor:pointer;margin-top:8px}
.fileT:focus-within,.fileL:focus-within{outline:3px solid #1F5FE0;outline-offset:2px}
.chkrow{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;line-height:1.5;margin:12px 0}
.chkrow input{width:24px;height:24px;flex:none;margin:0;accent-color:#A5409B}
.stat{display:block;background:#fff;border:0;box-shadow:var(--shs);border-radius:28px;padding:14px 16px}
.stat input{width:100%;border:0;background:none;font-weight:700;font-size:24px;padding:4px 0;color:var(--ink);min-height:44px}
.stat input::placeholder{color:#C9B8CC}
.unit{background:none;border:0;color:var(--mut);font-weight:400;font-size:13px;min-height:44px;padding:0 6px;cursor:pointer}
.sl{background:#fff;border:0;box-shadow:var(--shs);border-radius:30px;padding:16px 18px;margin-top:14px}
.rng{width:100%;accent-color:#A5409B;height:32px;margin:6px 0 0}
.mood3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.mdb{min-height:96px;border-radius:26px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:13.5px;color:var(--ink);cursor:pointer}
.mdb.on{background:#FCEBF3;border-color:#C24A8F}
.tlrow{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.tlc{display:flex;flex-direction:column;align-items:center;flex:none;width:34px}
.tld{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.tll{flex:1;width:0;border-left:2px dashed #E8C9DB;margin-top:4px}
.tlb{flex:1;background:#fff;box-shadow:var(--shs);border-radius:26px;padding:12px 16px;margin-bottom:12px;min-height:64px;display:flex;flex-direction:column;justify-content:center}
.bub{max-width:78%;padding:12px 14px;border-radius:24px;font-size:14px;font-weight:400;line-height:1.45;margin-bottom:10px}
.bub.them{background:#fff;box-shadow:var(--shs);align-self:flex-start;border-bottom-left-radius:8px}
.bub.me{background:var(--grad);color:#fff;align-self:flex-end;border-bottom-right-radius:8px}
.bub small{display:block;margin-top:4px;font-size:11.5px;opacity:.9}
.badge{display:inline-block;background:#F9E1EE;color:#8E2F73;font-weight:600;font-size:11.5px;border-radius:99px;padding:4px 10px}
.badge.ok{background:#D9F5E5;color:#1E6B49}
.pic{max-width:100%;border-radius:20px}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;font-weight:500;color:var(--mut)}
.bars span{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#E58AB5,#7A3A8C);min-height:4px}
.dotb{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:#E5538F;border:2px solid #fff}
.wkh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;padding:14px 16px;min-height:64px;cursor:pointer;color:var(--ink)}
.sect{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.hrow{background:#FCF7FB;border-radius:20px;padding:10px 12px;margin-top:8px;border-left:4px solid #E3B5D0}
.hrow.mom{background:#FFF8EA;border-left-color:#C9A25A}
.hrow.pro{background:#EAF7F0;border-left-color:#2F7A55}
.pairs{display:flex;align-items:flex-end;gap:6px;height:116px;margin-top:10px}
.pairs>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;font-weight:500;color:var(--mut);min-width:0}
.pr{display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
.pr i{display:block;width:45%;max-width:16px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#A5409B,#7A3A8C);min-height:4px}
.pr i.d{background:linear-gradient(180deg,#F5A9CB,#E5538F)}
.prev{background:#FCF4F9;border-radius:16px;padding:10px 12px;font-size:12px;line-height:1.5;white-space:pre-wrap;max-height:170px;overflow:auto;margin-top:6px}

.app{width:min(390px,100vw);height:min(844px,100dvh)}
@media (min-width:431px){.app{border-radius:30px;box-shadow:0 18px 50px rgba(160,70,120,.22)}}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">


<div class="app">

<!-- ===== secondary top bar ===== -->
<sc-if value="{{ showTop }}" hint-placeholder-val="{{ false }}">
<div class="top">
<button class="ibtn" aria-label="Back" onClick="{{ back }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.back }}"></path></svg></button>
<h1 class="tt">{{ title }}</h1>
<sc-if value="{{ sc.midwife }}" hint-placeholder-val="{{ false }}">
<div class="row" style="gap:8px">
<button class="ibtn g" aria-label="Call my ANM" onClick="{{ callAnm }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.phone }}"></path></svg></button>
<button class="ibtn b" aria-label="Start a video call" onClick="{{ videoNo }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.video }}"></path></svg></button>
</div>
</sc-if>
</div>
</sc-if>

<div class="scroll" ref="{{ scrollRef }}">

<!-- ================= HOME ================= -->
<sc-if value="{{ sc.home }}" hint-placeholder-val="{{ true }}">
<div>
<div class="hhero">
<div class="row" style="justify-content:space-between;align-items:flex-start">
<div><p class="gm">{{ greeting }}</p><h1 class="hi">Hi, {{ name }}<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><g fill="#F28FB8"><circle cx="12" cy="6" r="4.2"/><circle cx="18" cy="10.4" r="4.2"/><circle cx="15.7" cy="17.4" r="4.2"/><circle cx="8.3" cy="17.4" r="4.2"/><circle cx="6" cy="10.4" r="4.2"/></g><circle cx="12" cy="12" r="3.2" fill="#FFD9A8"/></svg></h1></div>
<button class="ibtn w" aria-label="Today's reminders" onClick="{{ openReminders }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.bell }}"></path></svg><sc-if value="{{ hasPending }}" hint-placeholder-val="{{ false }}"><span class="dotb"></span></sc-if></button>
</div>
<sc-if value="{{ hasDue }}" hint-placeholder-val="{{ true }}">
<button class="wkcard" onClick="{{ toJourney }}">
<span style="flex:1"><span class="cap" style="display:block">Pregnancy week</span><span class="big">{{ wkNum }}<span style="font-size:15px;font-weight:500;color:var(--mut)"> {{ wkOf }}</span></span></span>
<span class="ring" style="background:conic-gradient(from 0deg,#7A3A8C 0%,#E5538F {{ wkPct }}%,#F5E4F0 {{ wkPct }}%)" role="img" aria-label="Pregnancy progress"><span class="ringin"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.baby }}"></path></svg></span></span>
</button>
</sc-if>
<sc-if value="{{ noDue }}" hint-placeholder-val="{{ false }}"><div class="card" style="margin-top:16px;margin-bottom:0"><p class="b" style="margin:0 0 6px">Add your estimated due date</p><button class="btn" onClick="{{ openProfile }}">Add due date</button></div></sc-if>
</div>

<div class="pad">
<button class="rowcard" onClick="{{ openSummary }}">
<span class="tic ti-g"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.activity }}"></path></svg></span>
<span class="col" style="flex:1"><span class="b">Health summary</span><span class="muted">{{ summaryLine }}</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6B80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>

<div class="sh"><h2>Today for you</h2><button class="lnk" onClick="{{ openReminders }}">See all</button></div>
<sc-if value="{{ noToday }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="muted" style="margin:0">Nothing planned for today. Add a reminder with See all.</p></div></sc-if>
<sc-for list="{{ today }}" as="t" hint-placeholder-count="3">
<button class="rowcard" onClick="{{ t.pick }}">
<span class="tic {{ t.tint }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.ic }}"></path></svg></span>
<span class="col" style="flex:1"><span class="b">{{ t.title }}</span><span class="muted">{{ t.sub }}</span></span>
<span class="{{ t.badgeCls }}">{{ t.badge }}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6B80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>
</sc-for>

<div class="sh"><h2>Quick actions</h2></div>
<div class="grid3">
<sc-for list="{{ quick }}" as="q" hint-placeholder-count="6">
<button class="tile" onClick="{{ q.pick }}"><span class="tic {{ q.tint }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ q.ic }}"></path></svg></span><span>{{ q.t }}</span></button>
</sc-for>
</div>

<button class="rowcard" style="margin-top:14px" onClick="{{ openHistory }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A3A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.history }}"></path></svg>
<span class="b" style="flex:1">Patient history</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6B80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>

<button class="moodcard" onClick="{{ openMood }}">
<span class="tic" style="background:#fff;color:#B03F7A"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ F.Great }}"></path></svg></span>
<span class="col" style="flex:1"><span class="b">How are you feeling today?</span><span class="muted">Tap to log your mood in a moment.</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6B80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>

<sc-if value="{{ hasDue }}" hint-placeholder-val="{{ true }}">
<button class="rowcard" style="align-items:flex-start" onClick="{{ babyOpen }}">
<span class="tic ti-g"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.baby }}"></path></svg></span>
<span class="col" style="flex:1"><span class="cap">{{ babyCap }}</span><span class="b" style="font-size:17px">{{ babyTitle }}</span><span class="muted">{{ babyText }}</span></span>
</button>
</sc-if>

<button class="sosban" onClick="{{ toSos }}">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.alert }}"></path></svg>
<span class="col" style="flex:1"><span class="b" style="font-size:17px">Emergency SOS</span><span style="font-size:13px;font-weight:500;opacity:.95">Call ANM, ambulance or share location instantly.</span></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>
<p class="muted" style="text-align:center;margin:12px 0 0">MateriCare supports daily care. It does not diagnose or replace your care team.</p>
</div>
</div>
</sc-if>

<!-- ================= JOURNEY ================= -->
<sc-if value="{{ sc.journey }}" hint-placeholder-val="{{ false }}">
<div>
<div class="hdr"><button class="avt" aria-label="Profile" onClick="{{ openProfile }}">{{ initial }}</button><h1 class="tt">Your journey</h1></div>
<div class="pad">
<div class="hs"><sc-for list="{{ jChips }}" as="c" hint-placeholder-count="6"><button class="{{ c.cls }}" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}">{{ c.t }}</button></sc-for></div>
<button class="grad" style="display:block;width:100%;text-align:left;border:0;cursor:pointer;margin-top:10px;color:var(--ink)" onClick="{{ js.heroOpen }}">
<span class="cap" style="display:block">{{ js.label }}</span>
<span class="row" style="margin:6px 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A3A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.baby }}"></path></svg><span style="font-size:21px;font-weight:800">{{ js.title }}</span></span>
<span class="p" style="color:#3B3750;display:block">{{ js.text }}</span>
</button>
<sc-for list="{{ js.secs }}" as="s" hint-placeholder-count="5">
<button class="card" style="display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink)" onClick="{{ s.pick }}">
<span class="row" style="gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:{{ s.color }}"><path d="{{ s.ic }}"></path></svg><span class="b">{{ s.t }}</span></span>
<sc-if value="{{ s.hasText }}" hint-placeholder-val="{{ false }}"><span class="muted" style="display:block;margin-top:6px;font-size:14.5px">{{ s.text }}</span></sc-if>
<sc-if value="{{ s.hasTags }}" hint-placeholder-val="{{ false }}"><span class="tgs"><sc-for list="{{ s.tags }}" as="g" hint-placeholder-count="3"><span class="tg {{ s.tint }}">{{ g.x }}</span></sc-for></span></sc-if>
</button>
</sc-for>
<p class="note">Tests, vaccines and supplements depend on you. Your clinician decides what you need. Tap any card to read more.</p>
<button class="btn full" onClick="{{ startCheckin }}">Log today's check-in</button>
</div>
</div>
</sc-if>

<!-- ================= HEALTH ================= -->
<sc-if value="{{ sc.health }}" hint-placeholder-val="{{ false }}">
<div>
<div class="hdr"><button class="avt" aria-label="Profile" onClick="{{ openProfile }}">{{ initial }}</button><h1 class="tt">Health</h1></div>
<div class="pad">
<button class="grad" style="display:block;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink)" onClick="{{ openSummary }}">
<span class="cap" style="display:block">Health summary</span>
<span class="b" style="display:block;margin-top:4px;font-size:17px">Your saved records at a glance</span>
<span class="muted" style="display:block;margin-top:4px">{{ summaryLine }}</span>
</button>
<div class="grid2">
<sc-for list="{{ healthTiles }}" as="q" hint-placeholder-count="6">
<button class="tile l" onClick="{{ q.pick }}"><span class="tic {{ q.tint }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ q.ic }}"></path></svg></span><span class="col"><span class="b">{{ q.t }}</span><span class="muted" style="font-weight:500">{{ q.sub }}</span></span></button>
</sc-for>
</div>
<button class="rowcard" style="margin-top:12px" onClick="{{ openTimeline }}">
<span class="tic ti-t" style="border-radius:14px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.cal }}"></path></svg></span>
<span class="col" style="flex:1"><span class="b">Health timeline</span><span class="muted">All reports, visits and check-ins in one place</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6B80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>
<button class="rowcard" onClick="{{ openHistory }}">
<span class="tic ti-p"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.history }}"></path></svg></span>
<span class="col" style="flex:1"><span class="b">Patient history</span><span class="muted">Full record with filters and search</span></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6B80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.arrow }}"></path></svg>
</button>
</div>
</div>
</sc-if>

<!-- ================= PATIENT HISTORY ================= -->
<sc-if value="{{ sc.history }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<sc-if value="{{ H.anm }}" hint-placeholder-val="{{ false }}"><div class="note" style="margin-top:0;background:#EAF7F0;color:#1E5A3F">Healthcare professional view (demo). Read-only record of what was saved. No diagnosis, score or risk level is shown.</div></sc-if>
<div class="card">
<h2 class="h2" style="font-size:21px">My Pregnancy History</h2>
<p class="b" style="margin:8px 0 2px;font-size:17px">{{ H.name }}</p>
<p class="muted" style="margin:0">{{ H.ageTxt }}</p>
<p class="muted" style="margin:0">{{ H.weekTxt }}</p>
<p class="muted" style="margin:0">{{ H.dueTxt }}</p>
<p class="muted" style="margin:0">{{ H.rangeTxt }}</p>
<sc-if value="{{ H.notAnm }}" hint-placeholder-val="{{ true }}"><button class="btn full" style="margin-top:12px" onClick="{{ H.openShare }}">Share History with ANM / Midwife</button></sc-if>
<div class="row" style="margin-top:6px;flex-wrap:wrap;gap:4px"><button class="lnk" onClick="{{ H.toggleAnm }}">{{ H.anmBtn }}</button><button class="lnk" onClick="{{ addRecord }}">+ Add entry</button></div>
</div>
<sc-if value="{{ H.noDue }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="b" style="margin:0 0 4px">Add your due date to see weeks</p><p class="muted" style="margin:0 0 10px">History is grouped by pregnancy week, worked out from your estimated due date.</p><button class="btn" onClick="{{ openProfile }}">Add due date</button></div></sc-if>

<div class="grid3">
<sc-for list="{{ H.stats }}" as="c" hint-placeholder-count="6"><div style="background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 6px;text-align:center"><span class="b" style="display:block;font-size:21px;color:var(--prid)">{{ c.n }}</span><span class="muted" style="font-size:11.5px;line-height:1.25;display:block">{{ c.t }}</span></div></sc-for>
</div>
<p class="muted" style="font-size:12px;margin:8px 0 0">Counts come from saved records. Entries marked "Sample data" are demonstration data.</p>

<div class="sh" style="margin-top:16px"><h2>Trends</h2></div>
<sc-if value="{{ H.noCharts }}" hint-placeholder-val="{{ false }}"><div class="note" style="margin-top:0">Trend charts appear once at least two readings are saved. Nothing is estimated.</div></sc-if>
<sc-for list="{{ H.charts }}" as="c" hint-placeholder-count="2">
<div class="card">
<div class="row" style="justify-content:space-between"><span class="b">{{ c.t }}</span><span class="muted">{{ c.unit }}</span></div>
<div class="pairs" role="img" aria-label="{{ c.aria }}"><sc-for list="{{ c.bars }}" as="b" hint-placeholder-count="5"><div><span class="pr"><i style="height:{{ b.h1 }}px"></i><i class="d" style="height:{{ b.h2 }}px;display:{{ b.dsp }}"></i></span>{{ b.v }}</div></sc-for></div>
<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted" style="font-size:12px">{{ c.from }}</span><span class="muted" style="font-size:12px">{{ c.to }}</span></div>
<p class="muted" style="font-size:12px;margin:4px 0 0">{{ c.legend }}</p>
</div>
</sc-for>

<sc-if value="{{ H.anm }}" hint-placeholder-val="{{ false }}">
<div>
<div class="card"><h2 class="h2" style="margin-bottom:6px">Missing records to review</h2>
<sc-if value="{{ H.noMissing }}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">No gaps found in the weeks shown.</p></sc-if>
<sc-for list="{{ H.missing }}" as="m" hint-placeholder-count="2"><p class="p" style="padding:3px 0">{{ m.x }}</p></sc-for>
<p class="muted" style="font-size:12px;margin:6px 0 0">This only lists what was not recorded. It does not judge anything.</p></div>
<div class="card"><h2 class="h2" style="margin-bottom:6px">Add consultation note (demo)</h2>
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<label class="lbl" for="pn" style="margin-top:0">Note</label><textarea id="pn" class="inp" value="{{ fm.pn }}" onChange="{{ g.pn }}"></textarea>
<label class="lbl" for="pf">Follow-up date (optional)</label><input id="pf" class="inp" type="date" value="{{ fm.pf }}" onChange="{{ g.pf }}">
<button class="btn full" style="margin-top:12px" onClick="{{ H.savePn }}">Save note</button></div>
</div>
</sc-if>

<sc-if value="{{ H.hasShares }}" hint-placeholder-val="{{ false }}">
<div>
<div class="sh"><h2>Sharing log</h2></div>
<sc-for list="{{ H.shares }}" as="x" hint-placeholder-count="1">
<div class="card" style="padding:12px 16px"><div class="row" style="justify-content:space-between;align-items:flex-start"><span class="b">{{ x.to }}</span><span class="{{ x.badgeCls }}">{{ x.status }}</span></div><p class="muted" style="margin:4px 0 0">{{ x.when }} · {{ x.range }} · {{ x.count }} records</p>
<sc-if value="{{ x.canDemo }}" hint-placeholder-val="{{ false }}"><button class="lnk" style="padding:0" onClick="{{ x.demo }}">Demo only: simulate the ANM receiving it</button></sc-if></div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ H.showWeeks }}" hint-placeholder-val="{{ true }}">
<div>
<div class="sh"><h2>Weekly timeline</h2></div>
<div class="hs"><sc-for list="{{ H.wfilters }}" as="f" hint-placeholder-count="6"><button class="{{ f.cls }}" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}">{{ f.t }}</button></sc-for></div>
<div class="hs" style="margin-bottom:6px"><button class="btn2" style="min-height:44px;font-size:13.5px;flex:none" onClick="{{ H.jumpCur }}">Go to current week</button><button class="btn2" style="min-height:44px;font-size:13.5px;flex:none" onClick="{{ H.expandAll }}">Expand all</button><button class="btn2" style="min-height:44px;font-size:13.5px;flex:none" onClick="{{ H.collapseAll }}">Collapse all</button></div>
<sc-for list="{{ H.weeks }}" as="w" hint-placeholder-count="3">
<div class="card" id="wk-{{ w.n }}" style="padding:0;overflow:hidden;margin-top:10px">
<button class="wkh" aria-expanded="{{ w.open }}" onClick="{{ w.toggle }}">
<span class="col" style="flex:1"><span class="b" style="font-size:16px">{{ w.label }}</span><span class="muted" style="font-size:12.5px">{{ w.summary }}</span></span>
<sc-if value="{{ w.current }}" hint-placeholder-val="{{ false }}"><span class="badge ok">Current week</span></sc-if>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A3A8C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ w.chev }}"></path></svg>
</button>
<sc-if value="{{ w.open }}" hint-placeholder-val="{{ false }}">
<div style="padding:0 16px 16px">
<sc-if value="{{ w.empty }}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">No records available for this week.</p></sc-if>
<sc-if value="{{ w.noMatch }}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">No records match this filter for this week.</p></sc-if>
<sc-for list="{{ w.secs }}" as="sx" hint-placeholder-count="2">
<div class="sect">
<div class="row"><span class="tic {{ sx.tint }}" style="width:36px;height:36px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ sx.ic }}"></path></svg></span><span class="b" style="font-size:15px">{{ sx.t }}</span></div>
<sc-if value="{{ sx.hasMeta }}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:6px 0 0;font-size:12.5px">{{ sx.meta }}</p></sc-if>
<sc-for list="{{ sx.rows }}" as="r" hint-placeholder-count="1">
<div class="{{ r.cls }}">
<div class="row" style="justify-content:space-between;align-items:flex-start;gap:8px"><span class="b" style="font-size:14px">{{ r.head }}</span><sc-if value="{{ r.hasTag }}" hint-placeholder-val="{{ false }}"><span class="{{ r.tagCls }}" style="flex:none">{{ r.tag }}</span></sc-if></div>
<sc-for list="{{ r.lines }}" as="l" hint-placeholder-count="2"><p class="p" style="font-size:13.5px;margin-top:3px">{{ l.x }}</p></sc-for>
<sc-if value="{{ r.hasOpen }}" hint-placeholder-val="{{ false }}"><button class="btn2" style="min-height:44px;margin-top:8px;font-size:13.5px" onClick="{{ r.open }}">Open report</button></sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>
<p class="note">This is a record of what was entered. It does not diagnose conditions or give risk levels. Your own notes are shown in amber and healthcare professional notes in green.</p>
</div>
</sc-if>

<sc-if value="{{ sc.addRecord }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:8px">
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<label class="lbl" for="rk" style="margin-top:0">Type of entry</label>
<select id="rk" class="inp" value="{{ fm.rkind }}" onChange="{{ g.rkind }}"><option value="visit">ANM or doctor visit</option><option value="vaccine">Vaccination</option><option value="test">Test or scan</option><option value="other">Other note</option></select>
<label class="lbl" for="rt2">Title</label>
<input id="rt2" class="inp" placeholder="e.g. ANM visit" value="{{ fm.title }}" onChange="{{ g.title }}">
<label class="lbl" for="rd2">Date</label>
<input id="rd2" class="inp" type="date" value="{{ fm.date }}" onChange="{{ g.date }}">
<sc-if value="{{ H.isVisit }}" hint-placeholder-val="{{ false }}"><div>
<label class="lbl" for="vf">Facility (optional)</label><input id="vf" class="inp" value="{{ fm.fac }}" onChange="{{ g.fac }}">
<label class="lbl" for="vp">ANM, midwife or doctor (optional)</label><input id="vp" class="inp" value="{{ fm.prov }}" onChange="{{ g.prov }}">
<label class="lbl" for="vr">Reason for the visit (optional)</label><input id="vr" class="inp" value="{{ fm.reason }}" onChange="{{ g.reason }}">
<label class="lbl" for="vo">Measurements or observations recorded (optional)</label><input id="vo" class="inp" value="{{ fm.obs }}" onChange="{{ g.obs }}">
<label class="lbl" for="va">Tests advised or completed (optional)</label><input id="va" class="inp" value="{{ fm.advised }}" onChange="{{ g.advised }}">
<label class="lbl" for="vpn">Advice or notes from the healthcare professional (optional)</label><textarea id="vpn" class="inp" value="{{ fm.proN }}" onChange="{{ g.proN }}"></textarea>
<label class="lbl" for="vfu">Follow-up date (optional)</label><input id="vfu" class="inp" type="date" value="{{ fm.follow }}" onChange="{{ g.follow }}">
</div></sc-if>
<label class="lbl" for="rn2">Your own note (optional)</label>
<textarea id="rn2" class="inp" value="{{ fm.note }}" onChange="{{ g.note }}"></textarea>
<button class="btn full" style="margin-top:16px" onClick="{{ saveRecord }}">Save to history</button>
</div>
</sc-if>

<!-- ================= TIMELINE ================= -->
<sc-if value="{{ sc.timeline }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:16px">
<sc-if value="{{ noTl }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="muted" style="margin:0">Your timeline fills up as you save check-ins, reports and visits.</p></div></sc-if>
<sc-for list="{{ tlList }}" as="e" hint-placeholder-count="5">
<button class="tlrow" onClick="{{ e.pick }}">
<span class="tlc"><span class="tld" style="background:{{ e.tint }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ e.ic }}"></path></svg></span><span class="tll"></span></span>
<span class="tlb"><span class="cap" style="font-size:11.5px">{{ e.rel }}</span><span class="b">{{ e.title }}</span></span>
</button>
</sc-for>
<button class="btn2 full" style="margin-top:8px" onClick="{{ openHistory }}">Open full patient history</button>
</div>
</sc-if>

<!-- ================= ENTRY ================= -->
<sc-if value="{{ sc.entry }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<div class="card">
<h2 class="h2" style="margin-bottom:4px">{{ ent.title }}</h2>
<p class="muted" style="margin:0 0 10px">{{ ent.dateL }} · {{ ent.src }}</p>
<sc-for list="{{ ent.lines }}" as="l" hint-placeholder-count="3"><p class="p" style="padding:4px 0">{{ l.x }}</p></sc-for>
</div>
<sc-if value="{{ ent.canEdit }}" hint-placeholder-val="{{ false }}"><button class="btn full" onClick="{{ ent.edit }}">Edit this check-in</button></sc-if>
<sc-if value="{{ ent.hasReport }}" hint-placeholder-val="{{ false }}"><button class="btn2 full" onClick="{{ ent.openRep }}">View report</button></sc-if>
<sc-if value="{{ ent.canDel }}" hint-placeholder-val="{{ false }}"><button class="btn2 full" style="margin-top:10px;color:#8E2A0A" onClick="{{ ent.del }}">Delete this entry</button></sc-if>
<p class="note">Entries marked "Entered by you" came from you. Clinician-entered notes will be labelled separately when a clinic is connected.</p>
</div>
</sc-if>

<!-- ================= CHECK-IN ================= -->
<sc-if value="{{ sc.checkin }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;min-height:100%">
<div class="pad" style="flex:1">
<sc-if value="{{ editBadge }}" hint-placeholder-val="{{ false }}"><span class="badge" style="margin-bottom:10px">Editing a saved check-in</span></sc-if>
<sc-if value="{{ ciErr }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ ciErr }}</div></sc-if>
<p class="muted" style="margin:0 0 12px">Everything is optional. Leave blank what you did not measure. Blank is never counted as normal.</p>
<div class="grid2">
<label class="stat"><span class="cap" style="display:block">Blood pressure</span><input inputmode="numeric" placeholder="—" aria-label="Blood pressure, like 118/76" value="{{ d.bp }}" onChange="{{ h.bp }}"><span class="muted" style="display:block;text-align:right">mmHg</span></label>
<label class="stat"><span class="cap" style="display:block">Weight</span><input inputmode="decimal" placeholder="—" aria-label="Weight in kilograms" value="{{ d.weight }}" onChange="{{ h.weight }}"><span class="muted" style="display:block;text-align:right">kg</span></label>
<label class="stat"><span class="cap" style="display:block">Blood sugar</span><input inputmode="numeric" placeholder="—" aria-label="Blood sugar in mg per dL" value="{{ d.sugar }}" onChange="{{ h.sugar }}"><span class="muted" style="display:block;text-align:right">mg/dL</span></label>
<div class="stat"><label for="tmp" class="cap" style="display:block">Temperature</label><input id="tmp" inputmode="decimal" placeholder="—" value="{{ d.temp }}" onChange="{{ h.temp }}"><span style="display:block;text-align:right"><button class="unit" aria-label="Switch temperature unit" onClick="{{ toggleUnit }}">{{ unitTxt }} (tap to switch)</button></span></div>
</div>

<div class="sl">
<div class="row" style="justify-content:space-between"><label for="mv" class="cap">Baby movements today</label><span class="b" style="color:var(--pri)">{{ movesTxt }}</span></div>
<input id="mv" class="rng" type="range" min="0" max="50" step="1" value="{{ movesV }}" onChange="{{ h.moves }}">
<button class="lnk" style="text-decoration:underline" onClick="{{ toggleLess }}">{{ lessTxt }}</button>
<sc-if value="{{ d.moveLess }}" hint-placeholder-val="{{ false }}"><div class="urg" role="alert">Please contact your maternity care team or hospital promptly. Do not wait for a certain number of kicks.<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><a class="dng" href="tel:112">Call 112</a><button class="btn2" onClick="{{ toSos }}">Open SOS</button></div></div></sc-if>
<p class="muted" style="margin:4px 0 0;font-size:12.5px">Follow the movement advice from your care team. A count alone cannot show everything is fine.</p>
</div>

<div class="sl">
<div class="row" style="justify-content:space-between"><label for="wt2" class="cap">Water intake</label><span class="b" style="color:var(--pri)">{{ waterTxt }}</span></div>
<input id="wt2" class="rng" type="range" min="0" max="12" step="1" value="{{ waterV }}" onChange="{{ h.water }}">
</div>
<div class="sl">
<div class="row" style="justify-content:space-between"><label for="sp" class="cap">Sleep last night</label><span class="b" style="color:var(--pri)">{{ sleepTxt }}</span></div>
<input id="sp" class="rng" type="range" min="0" max="12" step="1" value="{{ sleepV }}" onChange="{{ h.sleep }}">
</div>

<div class="sl">
<span class="cap">Mood</span>
<div class="mood3"><sc-for list="{{ moodOpts }}" as="o" hint-placeholder-count="6"><button class="{{ o.cls }}" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#B03F7A"><path d="{{ o.ic }}"></path></svg>{{ o.t }}</button></sc-for></div>
</div>

<div class="sl">
<span class="cap">Symptoms</span>
<div class="chips" style="margin-top:10px"><sc-for list="{{ symOpts }}" as="o" hint-placeholder-count="9"><button class="{{ o.cls }}" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}">{{ o.t }}</button></sc-for></div>
<sc-if value="{{ H.hasSym }}" hint-placeholder-val="{{ false }}"><div><label class="lbl">How strong?</label><div class="chips"><sc-for list="{{ H.sevOpts }}" as="o" hint-placeholder-count="3"><button class="{{ o.cls }}" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}">{{ o.t }}</button></sc-for></div><label class="lbl" for="sdur">How long has it lasted?</label><input id="sdur" class="inp" placeholder="e.g. since morning, 2 days" value="{{ d.symDur }}" onChange="{{ h.symDur }}"></div></sc-if>
<div class="urg" role="note" style="font-weight:500;margin-bottom:0">Logging a symptom is not an emergency call. For heavy bleeding, severe belly pain, a seizure, trouble breathing, a severe headache with vision changes, or reduced baby movements, get help now.<div style="margin-top:10px"><button class="dng" onClick="{{ toSos }}">Open SOS</button></div></div>
</div>

<div class="sl">
<span class="cap">Medicines taken today?</span>
<div class="row" style="margin-top:10px;gap:8px"><sc-for list="{{ medOpts }}" as="o" hint-placeholder-count="3"><button class="{{ o.cls }}" style="flex:1;border-radius:18px" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}">{{ o.t }}</button></sc-for></div>
<p class="muted" style="margin:10px 0 0;font-size:12.5px">Missed a dose? Never double up. Ask your clinician or pharmacist.</p>
</div>

<div class="sl">
<label for="nt" class="cap">Notes</label>
<div class="row" style="margin-top:10px;align-items:flex-end"><textarea id="nt" class="inp" style="background:#F8EAF3;border-color:#F8EAF3" placeholder="Anything you'd like to add..." value="{{ d.notes }}" onChange="{{ h.notes }}"></textarea><button class="{{ micCls }}" aria-label="{{ micLabel }}" onClick="{{ recToggle }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.mic }}"></path></svg></button></div>
<div class="row" style="margin-top:8px"><sc-if value="{{ hasAudio }}" hint-placeholder-val="{{ false }}"><button class="btn2" style="min-height:44px" onClick="{{ playAudio }}">Play voice note</button></sc-if><span class="muted" style="font-size:12.5px">{{ recStatus }}</span></div>
<div class="chkrow"><input id="cons" type="checkbox" checked="{{ d.consent }}" onChange="{{ toggleConsent }}"><label for="cons">Save my typed notes and voice note on this device, private to my profile.</label></div>
<label class="fileL"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.upload }}"></path></svg><span>{{ attachTxt }}</span><input type="file" aria-label="Attach a file (optional)" onChange="{{ onAttach }}"></label>
</div>
</div>
<div class="fbar"><button class="btn full" onClick="{{ saveCi }}">Save check-in</button></div>
</div>
</sc-if>

<sc-if value="{{ sc.checkinDone }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="text-align:center;padding-top:70px">
<div class="tic ti-g" style="width:88px;height:88px;margin:0 auto 18px"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.check }}"></path></svg></div>
<h1 class="h2" style="font-size:24px">Check-in saved</h1>
<p class="muted" style="margin:8px 0 24px">Thank you. It now appears in your history and timeline.</p>
<button class="btn full" onClick="{{ doneHome }}">Back to Home</button>
<button class="btn2 full" style="margin-top:10px" onClick="{{ doneHistory }}">See it in my history</button>
</div>
</sc-if>

<!-- ================= MOOD quick ================= -->
<sc-if value="{{ sc.mood }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:14px">
<h2 class="h2">How are you feeling today?</h2>
<div class="mood3"><sc-for list="{{ moodQuick }}" as="o" hint-placeholder-count="6"><button class="{{ o.cls }}" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:#B03F7A"><path d="{{ o.ic }}"></path></svg>{{ o.t }}</button></sc-for></div>
<label class="lbl" for="mqn">Add a note (optional)</label>
<textarea id="mqn" class="inp" value="{{ fm.note }}" onChange="{{ g.note }}"></textarea>
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<p class="note">If you feel very low, hopeless or unsafe, tell someone you trust or your care team today.</p>
<button class="btn full" onClick="{{ saveMood }}">Save mood</button>
<button class="btn2 full" style="margin-top:10px" onClick="{{ startCheckinFromMood }}">Do the full check-in instead</button>
</div>
</sc-if>

<!-- ================= REMINDERS ================= -->
<sc-if value="{{ sc.reminders }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:14px">
<button class="btn full" onClick="{{ newReminder }}">+ Add a reminder</button>
<div style="height:12px"></div>
<sc-if value="{{ noRem }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="muted" style="margin:0">No reminders yet.</p></div></sc-if>
<sc-for list="{{ allRem }}" as="r" hint-placeholder-count="2">
<div class="card row" style="padding:10px 12px">
<button class="{{ r.chkCls }}" style="width:44px;height:44px;border-radius:50%;border:2.5px solid {{ r.chkBorder }};background:{{ r.chkBg }};color:#fff;cursor:pointer;flex:none;padding:0;display:flex;align-items:center;justify-content:center" aria-label="{{ r.chkLabel }}" onClick="{{ r.toggle }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.chkIc }}"></path></svg></button>
<button style="flex:1;text-align:left;background:none;border:0;padding:0;min-height:44px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;justify-content:center" onClick="{{ r.open }}"><span class="b">{{ r.title }}</span><span class="muted">{{ r.sub }}</span></button>
<button class="ibtn" aria-label="Snooze {{ r.title }} for 30 minutes" onClick="{{ r.snooze }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.clock }}"></path></svg></button>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ sc.reminder }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<label class="lbl" for="rtt" style="margin-top:0">What should we remind you about?</label>
<input id="rtt" class="inp" value="{{ fm.title }}" onChange="{{ g.title }}">
<label class="lbl" for="rsb">Short note (optional)</label>
<input id="rsb" class="inp" placeholder="e.g. After breakfast" value="{{ fm.sub }}" onChange="{{ g.sub }}">
<label class="lbl" for="rti">Time (optional)</label>
<input id="rti" class="inp" type="time" value="{{ fm.time }}" onChange="{{ g.time }}">
<button class="btn full" style="margin-top:16px" onClick="{{ saveRem }}">Save reminder</button>
<sc-if value="{{ remExisting }}" hint-placeholder-val="{{ false }}"><button class="btn2 full" style="margin-top:10px;color:#8E2A0A" onClick="{{ remDelete }}">Delete reminder</button></sc-if>
</div>
</sc-if>

<!-- ================= TASK detail (today for you) ================= -->
<sc-if value="{{ sc.task }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<div class="card"><span class="cap">{{ tk.cap }}</span><h2 class="h2" style="margin:4px 0 6px;font-size:20px">{{ tk.title }}</h2><p class="muted" style="margin:0">{{ tk.sub }}</p></div>
<p class="p" style="margin-bottom:12px">{{ tk.info }}</p>
<sc-if value="{{ tk.canDone }}" hint-placeholder-val="{{ false }}"><button class="btn full" onClick="{{ tk.done }}">{{ tk.doneTxt }}</button></sc-if>
<sc-if value="{{ tk.hasMed }}" hint-placeholder-val="{{ false }}"><button class="btn2 full" style="margin-top:10px" onClick="{{ tk.openMed }}">Open medicine details</button></sc-if>
<sc-if value="{{ tk.canEdit }}" hint-placeholder-val="{{ false }}"><button class="btn2 full" style="margin-top:10px" onClick="{{ tk.edit }}">Edit reminder</button></sc-if>
<sc-if value="{{ tk.canCancel }}" hint-placeholder-val="{{ false }}"><button class="btn2 full" style="margin-top:10px;color:#8E2A0A" onClick="{{ tk.cancel }}">Cancel this appointment</button></sc-if>
<button class="btn2 full" style="margin-top:10px" onClick="{{ tk.ask }}">Message my ANM about this</button>
</div>
</sc-if>

<!-- ================= SUMMARY ================= -->
<sc-if value="{{ sc.summary }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<p class="note">Built only from what is saved in your record. It gives no diagnosis, score or risk level.</p>
<sc-for list="{{ sumSections }}" as="s" hint-placeholder-count="3">
<div class="card"><h2 class="h2" style="margin-bottom:6px">{{ s.h }}</h2><sc-for list="{{ s.items }}" as="i" hint-placeholder-count="2"><p class="p" style="padding:3px 0">{{ i.x }}</p></sc-for></div>
</sc-for>
<div class="card"><h2 class="h2" style="margin-bottom:6px">Not recorded yet</h2><sc-for list="{{ sumMissing }}" as="i" hint-placeholder-count="2"><p class="p" style="padding:3px 0">{{ i.x }}</p></sc-for><sc-if value="{{ noMissing }}" hint-placeholder-val="{{ false }}"><p class="p">Nothing important is missing.</p></sc-if></div>
<div class="card"><h2 class="h2" style="margin-bottom:6px">Questions you could ask your care team</h2><p class="p" style="padding:3px 0">Which tests or visits are due next?</p><p class="p" style="padding:3px 0">Is there anything you want me to track differently?</p><p class="p" style="padding:3px 0">When should I contact you between visits?</p></div>
<button class="btn full" onClick="{{ askRecord }}">Send these questions to my ANM</button>
</div>
</sc-if>

<!-- ================= PATTERNS ================= -->
<sc-if value="{{ sc.patterns }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<sc-if value="{{ noCharts }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="b" style="margin:0 0 4px">Not enough data yet</p><p class="muted" style="margin:0 0 12px">Save at least two check-ins to see trends over time.</p><button class="btn" onClick="{{ startCheckin }}">Start a check-in</button></div></sc-if>
<sc-for list="{{ charts }}" as="c" hint-placeholder-count="3">
<div class="card"><div class="row" style="justify-content:space-between"><span class="b">{{ c.t }}</span><span class="muted">{{ c.unit }}</span></div>
<div class="bars" role="img" aria-label="{{ c.aria }}"><sc-for list="{{ c.bars }}" as="b" hint-placeholder-count="5"><div><span style="height:{{ b.h }}px"></span>{{ b.v }}</div></sc-for></div>
<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted" style="font-size:12px">{{ c.from }}</span><span class="muted" style="font-size:12px">{{ c.to }}</span></div></div>
</sc-for>
<sc-if value="{{ hasBp }}" hint-placeholder-val="{{ false }}"><div class="card"><span class="b">Blood pressure readings</span><sc-for list="{{ bpList }}" as="r" hint-placeholder-count="3"><div class="row" style="justify-content:space-between;padding:6px 0"><span class="muted">{{ r.d }}</span><span class="b">{{ r.v }}</span></div></sc-for></div></sc-if>
<p class="note">Trends only show what you entered. They do not diagnose or predict anything. Talk to your care team about any numbers that worry you.</p>
</div>
</sc-if>

<!-- ================= REPORTS ================= -->
<sc-if value="{{ sc.reports }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:14px">
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<div class="grid3">
<label class="fileT"><span class="tic" style="background:#7A3A8C;color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.camera }}"></path></svg></span>Camera<input type="file" accept="image/*" capture="environment" aria-label="Take a photo of a report" onChange="{{ onPick }}"></label>
<label class="fileT"><span class="tic" style="background:#7A3A8C;color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.image }}"></path></svg></span>Gallery<input type="file" accept="image/*" aria-label="Choose a report image from gallery" onChange="{{ onPick }}"></label>
<label class="fileT"><span class="tic" style="background:#7A3A8C;color:#fff"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.file }}"></path></svg></span>PDF<input type="file" accept="application/pdf" aria-label="Upload a PDF report" onChange="{{ onPick }}"></label>
</div>
<div class="note" style="border-radius:22px">Keep reports together and prepare questions for your care team. Values are shown exactly as written in the report. AI explanations are not connected in this prototype, and reports are never scored.</div>
<label class="lbl" for="rq">Search reports</label>
<input id="rq" class="inp" type="search" placeholder="Name or category" value="{{ rq }}" onChange="{{ onRq }}">
<p class="cap" style="margin:18px 0 10px">Timeline</p>
<sc-if value="{{ noRepF }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="b" style="margin:0 0 4px">No reports yet</p><p class="muted" style="margin:0">Upload a photo or PDF of a test result, scan or prescription.</p></div></sc-if>
<sc-for list="{{ repList }}" as="r" hint-placeholder-count="1">
<div class="card">
<div class="row" style="justify-content:space-between;align-items:flex-start"><div class="col"><span class="b" style="font-size:17px">{{ r.head }}</span><span class="muted">{{ r.sub }}</span></div><span class="badge ok">{{ r.badge }}</span></div>
<sc-if value="{{ r.hasVals }}" hint-placeholder-val="{{ false }}"><div style="margin-top:10px"><sc-for list="{{ r.vals }}" as="v" hint-placeholder-count="3"><div class="row" style="justify-content:space-between;padding:4px 0"><span class="muted" style="font-size:15px">{{ v.k }}</span><span class="b">{{ v.v }}</span></div></sc-for><p class="muted" style="font-size:12px;margin:4px 0 0">Values as written in the report. Interpretation depends on your pregnancy stage. Please confirm with your doctor or midwife.</p></div></sc-if>
<div class="row" style="margin-top:12px;gap:8px"><button class="btn2" style="flex:1;min-height:46px;padding:0 8px;font-size:13.5px" onClick="{{ r.toMw }}">Share with midwife</button><button class="btn2" style="flex:1;min-height:46px;padding:0 8px;font-size:13.5px" onClick="{{ r.toDoc }}">Share with doctor</button><button class="ibtn" aria-label="Open details for {{ r.head }}" onClick="{{ r.open }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.edit }}"></path></svg></button></div>
</div>
</sc-for>
<p class="cap" style="margin:18px 0 8px">Upload history</p>
<sc-if value="{{ noRepF }}" hint-placeholder-val="{{ false }}"><p class="muted" style="margin:0">Nothing uploaded yet.</p></sc-if>
<sc-for list="{{ repHist }}" as="r" hint-placeholder-count="1"><p class="muted" style="margin:4px 0">{{ r.hist }}</p></sc-for>
</div>
</sc-if>

<sc-if value="{{ sc.uploadReport }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<div class="card"><span class="b">{{ pendingName }}</span><p class="muted" style="margin:2px 0 0">{{ pendingInfo }}</p></div>
<label class="lbl" for="un">Report name</label>
<input id="un" class="inp" value="{{ fm.name }}" onChange="{{ g.name }}">
<label class="lbl" for="uc">Category</label>
<select id="uc" class="inp" value="{{ fm.cat }}" onChange="{{ g.cat }}"><option>Blood</option><option>Urine</option><option>Ultrasound or scan</option><option>Glucose</option><option>Prescription</option><option>Vaccination record</option><option>Discharge summary</option><option>Other</option></select>
<label class="lbl" for="ud">Report date</label>
<input id="ud" class="inp" type="date" value="{{ fm.date }}" onChange="{{ g.date }}">
<button class="btn full" style="margin-top:16px" onClick="{{ saveReport }}">Save report</button>
<button class="btn2 full" style="margin-top:10px" onClick="{{ discardPending }}">Choose a different file</button>
</div>
</sc-if>

<sc-if value="{{ sc.report }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<sc-if value="{{ rep.missing }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="muted" style="margin:0">This report was not found.</p></div></sc-if>
<sc-if value="{{ rep.ok }}" hint-placeholder-val="{{ false }}">
<div>
<div class="card"><h2 class="h2" style="margin-bottom:2px">{{ rep.name }}</h2><p class="muted" style="margin:0">{{ rep.sub }}</p></div>
<sc-if value="{{ rep.isImg }}" hint-placeholder-val="{{ false }}"><div class="card"><img class="pic" src="{{ rep.url }}" alt="Uploaded report image"></div></sc-if>
<sc-if value="{{ rep.isPdf }}" hint-placeholder-val="{{ false }}"><a class="btn2 full" href="{{ rep.url }}" target="_blank">Open original PDF</a></sc-if>
<sc-if value="{{ rep.noFile }}" hint-placeholder-val="{{ false }}"><div class="note">No original file is attached to this entry. Files are not kept after a reload in this prototype.</div></sc-if>
<label class="lbl" for="rn">Rename</label>
<input id="rn" class="inp" value="{{ fm.name }}" onChange="{{ g.name }}">
<label class="lbl" for="rc">Category</label>
<select id="rc" class="inp" value="{{ fm.cat }}" onChange="{{ g.cat }}"><option>Blood</option><option>Urine</option><option>Ultrasound or scan</option><option>Glucose</option><option>Prescription</option><option>Vaccination record</option><option>Discharge summary</option><option>Other</option></select>
<label class="lbl" for="rd">Report date</label>
<input id="rd" class="inp" type="date" value="{{ fm.date }}" onChange="{{ g.date }}">
<label class="lbl" for="rqn">Questions for my clinician</label>
<textarea id="rqn" class="inp" value="{{ fm.questions }}" onChange="{{ g.questions }}"></textarea>
<button class="btn full" style="margin-top:14px" onClick="{{ saveRepEdit }}">Save changes</button>
<button class="btn2 full" style="margin-top:10px;color:#8E2A0A" onClick="{{ delRep }}">Delete report</button>
</div>
</sc-if>
</div>
</sc-if>

<!-- ================= MEDICINES ================= -->
<sc-if value="{{ sc.medicines }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:14px">
<p class="note">Add only medicines your clinician prescribed, with the instructions on the prescription. MateriCare never suggests medicines or doses.</p>
<button class="btn full" onClick="{{ addMed }}">+ Add a medicine</button>
<div style="height:12px"></div>
<sc-if value="{{ noMeds }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="b" style="margin:0 0 4px">No medicines yet</p><p class="muted" style="margin:0">A reminder is created for the time you enter.</p></div></sc-if>
<sc-for list="{{ medList }}" as="m" hint-placeholder-count="1"><button class="rowcard" onClick="{{ m.pick }}"><span class="tic ti-p"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.pill }}"></path></svg></span><span class="col" style="flex:1"><span class="b">{{ m.name }}</span><span class="muted">{{ m.sub }}</span><span class="muted">{{ m.today }}</span></span></button></sc-for>
</div>
</sc-if>

<sc-if value="{{ sc.medAdd }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:8px">
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<label class="lbl" for="mnm" style="margin-top:0">Medicine name (as on the prescription)</label>
<input id="mnm" class="inp" value="{{ fm.name }}" onChange="{{ g.name }}">
<label class="lbl" for="mds">Dosage instructions (copy from the prescription)</label>
<input id="mds" class="inp" value="{{ fm.dose }}" onChange="{{ g.dose }}">
<label class="lbl" for="msc">Schedule (e.g. once daily, after food)</label>
<input id="msc" class="inp" value="{{ fm.sched }}" onChange="{{ g.sched }}">
<label class="lbl" for="mti">Reminder time</label>
<input id="mti" class="inp" type="time" value="{{ fm.time }}" onChange="{{ g.time }}">
<label class="lbl" for="mst">Start date (optional)</label>
<input id="mst" class="inp" type="date" value="{{ fm.start }}" onChange="{{ g.start }}">
<label class="lbl" for="men">End date (optional)</label>
<input id="men" class="inp" type="date" value="{{ fm.end }}" onChange="{{ g.end }}">
<label class="lbl" for="mby">Prescribed by (optional)</label>
<input id="mby" class="inp" value="{{ fm.by }}" onChange="{{ g.by }}">
<button class="btn full" style="margin-top:16px" onClick="{{ saveMed }}">Save medicine</button>
</div>
</sc-if>

</div>
</sc-if>

<!-- ================= MIDWIFE CHAT ================= -->

<button class="chip" style="border-radius:22px;background:#F8EAF3;border-color:#F8EAF3;display:flex;flex-direction:column;gap:2px;padding:8px 4px;min-height:60px;align-items:center" onClick="{{ mwShare }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A3A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.file }}"></path></svg>Share report</button>
<button class="chip" style="border-radius:22px;background:#F8EAF3;border-color:#F8EAF3;display:flex;flex-direction:column;gap:2px;padding:8px 4px;min-height:60px;align-items:center" onClick="{{ mwVoice }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A3A8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.mic }}"></path></svg>Voice note</button>
</div>
</div>
<div style="flex:1;padding:14px 16px;display:flex;flex-direction:column">
<p class="note" style="margin-top:0">Prototype: no clinic is connected. Messages and requests are saved on this device and are not delivered.</p>

</div>
</sc-if>
<sc-for list="{{ chat }}" as="m" hint-placeholder-count="3"><div class="{{ m.cls }}">{{ m.text }}<small>{{ m.when }}{{ m.status }}</small></div></sc-for>
</div>
<div class="fbar" style="background:#fff">
<input class="inp" style="background:#F8EAF3;border-color:#F8EAF3;border-radius:99px" aria-label="Message your midwife" placeholder="Message your midwife…" value="{{ chatText }}" onChange="{{ onChatText }}">
<button class="ibtn" style="background:var(--grad);color:#fff;width:48px;height:48px" aria-label="Send message" onClick="{{ sendChat }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.send }}"></path></svg></button>
</div>
</div>
</sc-if>

<sc-if value="{{ sc.compose }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<sc-if value="{{ fm.err }}" hint-placeholder-val="{{ false }}"><div class="err" role="alert">{{ fm.err }}</div></sc-if>
<sc-if value="{{ cm.book }}" hint-placeholder-val="{{ false }}">
<div>
<label class="lbl" for="at" style="margin-top:0">Type of visit</label>
<select id="at" class="inp" value="{{ fm.atype }}" onChange="{{ g.atype }}"><option>ANM visit</option><option>Doctor visit</option><option>Antenatal check-up</option><option>Other</option></select>

<input id="ad" class="inp" type="date" value="{{ fm.date }}" onChange="{{ g.date }}">

<button class="btn full" style="margin-top:16px" onClick="{{ sendBook }}">Request visit</button>
</div>
</sc-if>
<sc-if value="{{ cm.chat }}" hint-placeholder-val="{{ false }}">

</sc-if>
<sc-if value="{{ cm.voice }}" hint-placeholder-val="{{ false }}">

<div class="card" style="text-align:center"><button class="{{ recBtnCls }}" style="min-width:200px" onClick="{{ recToggle2 }}">{{ recBtnTxt }}</button><sc-if value="{{ hasAudio }}" hint-placeholder-val="{{ false }}"><div style="margin-top:10px"><button class="btn2" onClick="{{ playAudio }}">Play recording</button></div></sc-if><p class="muted" style="margin:10px 0 0">{{ recStatus }}</p></div>
<button class="btn full" style="margin-top:12px" onClick="{{ sendVoice }}">Save voice note</button>
</div>
</sc-if>
<sc-if value="{{ cm.share }}" hint-placeholder-val="{{ false }}">
<div>
<p class="p">Share with: <b>{{ shareTo }}</b>. Choose a report. Nothing is shared unless you select it and agree below.</p>
<sc-if value="{{ noRepsShare }}" hint-placeholder-val="{{ false }}"><div class="card" style="margin-top:10px"><p class="muted" style="margin:0 0 10px">You have no reports yet.</p><button class="btn2" onClick="{{ openReports }}">Upload a report</button></div></sc-if>
<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px"><sc-for list="{{ shareOpts }}" as="o" hint-placeholder-count="1"><button class="{{ o.cls }}" style="text-align:left;border-radius:20px" aria-pressed="{{ o.on }}" onClick="{{ o.pick }}">{{ o.t }}</button></sc-for></div>

<!-- ================= HELP CHAT ================= -->
<sc-if value="{{ sc.chat }}" hint-placeholder-val="{{ false }}">

<sc-for list="{{ help }}" as="m" hint-placeholder-count="2">
<div class="{{ m.cls }}">{{ m.text }}
<sc-if value="{{ m.hasLinks }}" hint-placeholder-val="{{ false }}"><span style="display:flex;flex-direction:column;gap:6px;margin-top:8px"><sc-for list="{{ m.links }}" as="l" hint-placeholder-count="2"><button class="btn2" style="min-height:44px;font-size:13.5px;text-align:left" onClick="{{ l.pick }}">{{ l.t }}</button></sc-for></span></sc-if>
<sc-if value="{{ m.sos }}" hint-placeholder-val="{{ false }}"><span style="display:block;margin-top:8px"><button class="dng" onClick="{{ toSos }}">Open SOS</button></span></sc-if>
<sc-if value="{{ m.askMw }}" hint-placeholder-val="{{ false }}"><span style="display:block;margin-top:8px"><button class="btn2" onClick="{{ openMidwife }}">Ask my midwife</button></span></sc-if>
</div>
</sc-for>
</div>
<div class="fbar" style="background:#fff">
<input class="inp" style="background:#F8EAF3;border-color:#F8EAF3;border-radius:99px" aria-label="Ask a question" placeholder="Ask about a pregnancy topic…" value="{{ helpText }}" onChange="{{ onHelpText }}">
<button class="ibtn" style="background:var(--grad);color:#fff;width:48px;height:48px" aria-label="Send question" onClick="{{ sendHelp }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.send }}"></path></svg></button>
</div>
</div>
</sc-if>

<!-- ================= LEARN ================= -->
<sc-if value="{{ sc.learn }}" hint-placeholder-val="{{ false }}">
<div>
<div class="hdr"><button class="avt" aria-label="Profile" onClick="{{ openProfile }}">{{ initial }}</button><h1 class="tt">Learning centre</h1></div>
<div class="pad">
<label class="lbl" for="lq" style="margin-top:0">Search articles</label>
<input id="lq" class="inp" type="search" placeholder="Search topics" value="{{ q }}" onChange="{{ onQ }}">
<sc-if value="{{ hasQ }}" hint-placeholder-val="{{ false }}">
<div>
<div class="sh"><h2>Results</h2><button class="lnk" onClick="{{ clearQ }}">Clear</button></div>
<sc-if value="{{ noQ }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="muted" style="margin:0">No articles match. Try another word.</p></div></sc-if>
<sc-for list="{{ qResults }}" as="a" hint-placeholder-count="2"><button class="rowcard" onClick="{{ a.pick }}"><span class="col" style="flex:1"><span class="b">{{ a.t }}</span><span class="muted">{{ a.i }}</span></span></button></sc-for>
</div>
</sc-if>
<sc-if value="{{ noQuery }}" hint-placeholder-val="{{ true }}">
<div>
<button class="grad" style="display:block;width:100%;text-align:left;border:0;cursor:pointer;margin-top:14px;color:var(--ink)" onClick="{{ openFeatured }}"><span class="cap" style="display:block">Featured</span><span class="b" style="display:block;margin:6px 0 4px;font-size:19px">Iron-rich foods in the second trimester</span><span class="muted">5 min read · Audio available</span></button>
<div class="grid2"><sc-for list="{{ cats }}" as="c" hint-placeholder-count="12"><button class="tile l" style="min-height:140px;justify-content:flex-start" onClick="{{ c.pick }}"><span class="tic {{ c.tint }}" style="border-radius:20px;width:56px;height:56px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.ic }}"></path></svg></span><span class="col"><span class="b">{{ c.t }}</span><span class="muted" style="font-weight:500;font-size:12.5px">Text · Audio</span></span></button></sc-for></div>
<div class="sh"><h2>Saved</h2></div>
<sc-if value="{{ noSaved }}" hint-placeholder-val="{{ false }}"><div class="card"><p class="muted" style="margin:0">Tap Save on an article to keep it here.</p></div></sc-if>
<sc-for list="{{ savedList }}" as="a" hint-placeholder-count="1"><button class="rowcard" onClick="{{ a.pick }}"><span class="b" style="flex:1">{{ a.t }}</span></button></sc-for>
</div>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ sc.list }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:14px">
<sc-for list="{{ listItems }}" as="a" hint-placeholder-count="4"><button class="rowcard" onClick="{{ a.pick }}"><span class="col" style="flex:1"><span class="b">{{ a.t }}</span><span class="muted">{{ a.i }}</span></span><span class="badge">{{ a.savedTxt }}</span></button></sc-for>
</div>
</sc-if>

<sc-if value="{{ sc.article }}" hint-placeholder-val="{{ false }}">
<div class="pad" style="padding-top:12px">
<span class="badge">{{ art.tag }}</span>
<h2 class="h2" style="font-size:23px;margin:8px 0">{{ art.t }}</h2>
<p class="p" style="font-weight:600">{{ art.i }}</p>
<div class="row" style="flex-wrap:wrap;margin:12px 0;gap:8px">
<button class="btn2" style="min-height:46px" onClick="{{ listen }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.volume }}"></path></svg>{{ listenTxt }}</button>
<button class="btn2" style="min-height:46px" aria-pressed="{{ art.saved }}" onClick="{{ art.toggleSave }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.bookmark }}"></path></svg>{{ art.saveTxt }}</button>
<button class="btn2" style="min-height:46px" onClick="{{ shareArt }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.share }}"></path></svg>Share</button>
</div>
<sc-for list="{{ art.pp }}" as="x" hint-placeholder-count="3"><div class="card" style="padding:14px 16px"><p class="p">{{ x.x }}</p></div></sc-for>

<button class="btn full" onClick="{{ askAbout }}">Ask my midwife about this</button>

</div>
</sc-if>

<button class="btn full" onClick="{{ askScheme }}">Ask my ANM or ASHA about schemes</button>
</div>
</sc-if>

<!-- ================= SOS ================= -->
<sc-if value="{{ sc.sos }}" hint-placeholder-val="{{ false }}">
<div>
<div style="background:#C9483C;color:#fff;padding:18px 18px 22px;border-radius:0 0 40px 40px">
<span class="row" style="gap:8px;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ I.alert }}"></path></svg>Emergency</span>
